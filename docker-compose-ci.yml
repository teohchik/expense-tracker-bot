version: "3.9"

services:
  bot_back_service:
    container_name: expenses_back
    image: bot-image:latest
    networks:
      - myNetwork

  bot_celery_worker_service:
    container_name: bot_celery_worker
    image: bot-image:latest
    networks:
      - myNetwork
    command: celery --app=src.tasks.celery_app:celery_inst worker -l INFO

  bot_celery_beat_service:
    container_name: bot_celery_beat
    image: bot-image:latest
    networks:
      - myNetwork
    command: celery --app=src.tasks.celery_app:celery_inst beat -l INFO

networks:
  myNetwork:
    external: true